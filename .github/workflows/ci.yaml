name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wheels:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      coverage: ${{ steps.emit.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Fail before any build: check_tag.py is stdlib-only, and a mistagged
      # push should not pay for the matrix first.
      - env:
          TAG: ${{ github.ref_name }}
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 tools/check_tag.py "$TAG"
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - run: nix develop --command uv sync --locked --no-install-workspace --only-group ci
      - run: nix develop --command uv run --no-sync camas ci
      - run: nix build .#default --out-link result-wheels
      - run: nix build .#release --out-link result-release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels
          path: result-wheels/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release
          path: result-release/*
          if-no-files-found: error
      - id: emit
        run: |
          matrix=$(nix develop --command uv run --no-sync camas coverage --github-matrix=variants)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  coverage:
    needs: wheels
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.wheels.outputs.coverage) }}
    runs-on: ${{ matrix.OS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.32 # the flake's pkgs.uv; the wheel leg's measured precedence is this resolver's
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wheels
          path: result-wheels
      - run: uv sync --locked --no-install-workspace --only-group ci
      - run: uv run --no-sync camas coverage --OS ${{ matrix.OS }} --PY ${{ matrix.PY }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [wheels, coverage]
    runs-on: ubuntu-latest
    # A constant group instead of the workflow's per-ref one: two tags are two
    # refs, and both must not publish at once. cancel-in-progress: false — a
    # half-finished PyPI upload is the state worth avoiding. The workflow-level
    # group still cancels a same-ref re-push mid-upload, which is the accepted
    # trade (upstream camas makes it too); a force-pushed tag that dies between
    # file uploads leaves a release PyPI refuses to overwrite.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    environment:
      name: pypi
      url: https://pypi.org/p/salix
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release
          path: result-release
      # dist/ because that is where the publish action looks, and a symlink
      # into the nix store is not something it can read.
      - run: |
          mkdir -p dist
          cp -L result-release/*.whl result-release/*.tar.gz dist/
          ls -l dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

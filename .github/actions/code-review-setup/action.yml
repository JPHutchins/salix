name: code-review-setup
description: Nix toolchain + store cache + a warmed dev shell and uv environment, so the review agent can run `nix develop --command uv run camas <task>`
runs:
  using: composite
  steps:
    - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
    - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
    - shell: bash
      run: nix develop --command uv sync --no-install-workspace

[build-system]
requires = ["setuptools>=77", "tomli>=2; python_version < '3.11'"]
build-backend = "setuptools.build_meta"

[project]
name = "salix"
version = "0.1.0a1"
description = "A C-backed, inheritable Struct base class for Python — fast import, fast type creation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "JP Hutchins", email = "jphutchins@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "struct",
    "dataclass",
    "slots",
    "frozen",
    "immutable",
    "import-time",
    "free-threading",
    "c-extension",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/JPHutchins/salix"
Issues = "https://github.com/JPHutchins/salix/issues"

[tool.setuptools]
py-modules = []
packages = ["salix"]

[tool.setuptools.package-data]
salix = ["py.typed", "__init__.pyi"]

[dependency-groups]
ci = ["camas==0.1.29"]
dev = ["setuptools>=77", "camas[mcp]==0.1.29"]

[tool.pyright]
reportUnnecessaryTypeIgnoreComment = "error"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["bench", "tests", "tools"]

[tool.ruff]
extend-exclude = ["tests/test_generics_pep695.py", "bench/source-tiers/vendor"]
[tool.ruff.lint]
select = [
    "F",
    "E4",
    "E7",
    "E9",
    "E402",
    "B",
    "BLE",
    "FLY",
    "I",
    "PLE",
    "PLW",
    "PLR0124",
    "PYI",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/typing/rejected.py" = ["B015", "B018"]

[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = "--doctest-glob=README.md"
